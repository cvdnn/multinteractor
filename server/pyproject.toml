[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multinteractor-server"
version = "0.1.0"
description = "Cross-device cloud hub with client/subscription management, stream-teeing cache, and SQLite audit logging"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "aiofiles>=24.1.0",
    "blake3>=0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
