[workspace]
resolver = "2"
members = [
    "crates/mi-protocol",
    "crates/mi-daemon",
    "crates/mi-os",
    "crates/mi-cli",
    "crates/mi-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["multinteractor"]

[workspace.dependencies]
mi-protocol = { path = "crates/mi-protocol" }
mi-daemon = { path = "crates/mi-daemon" }
mi-os = { path = "crates/mi-os" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
tokio = { version = "1.41", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive"] }
