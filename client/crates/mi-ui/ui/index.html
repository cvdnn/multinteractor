<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>multinteractor — 同步到目标设备目录</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-primary: #F8FAFC;
      --bg-surface: #FFFFFF;
      --border-subtle: #E2E8F0;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --accent: #2563EB;
      --accent-soft: #EFF6FF;
      --success: #16A34A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "PingFang SC", sans-serif;
    }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
    }
    .modal-card {
      max-width: 520px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .badge-lan {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #DCFCE7;
      color: var(--success);
      font-weight: 600;
    }
    .breadcrumb-bar {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 10px;
    }
    .tree-container {
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      height: 260px;
      overflow-y: auto;
      padding: 6px;
      background: var(--bg-surface);
    }
    .tree-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 32px;
      padding: 0 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .tree-row:hover { background: #F1F5F9; }
    .tree-row.selected {
      background: var(--accent-soft);
      border-left: 2px solid var(--accent);
      font-weight: 600;
    }
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    button {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary {
      background: var(--bg-surface);
      border-color: var(--border-subtle);
      color: var(--text-primary);
    }
    #transfer-toast-slot {
      margin-top: 12px;
      font-size: 12px;
      color: var(--success);
    }
  </style>
</head>
<body>
  <div id="app" class="modal-card">
    <div class="modal-header">
      <strong id="target-device-title">同步到目标机器</strong>
      <div>
        <span class="badge-lan">LAN 直连优先</span>
        <span id="free-space-badge">剩余空间: -- GB</span>
      </div>
    </div>
    <div id="breadcrumb-path" class="breadcrumb-bar">ROOT</div>
    <div id="directory-tree" class="tree-container" role="tree" aria-label="远程目录树"></div>
    <div class="actions-bar">
      <button id="btn-remote-mkdir" class="btn-secondary" type="button">+ 新建文件夹</button>
      <div>
        <button id="btn-confirm-sync" class="btn-primary" type="button">同步到此目录</button>
      </div>
    </div>
    <div id="transfer-toast-slot" aria-live="polite"></div>
  </div>
  <script type="module" src="./directory_picker.js"></script>
  <script type="module" src="./transfer_toast.js"></script>
</body>
</html>
